name: Update docker image

on:
  push:
  workflow_dispatch:
env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_ORG_NAME }}/aave_tests
jobs:
  dockerize:
    runs-on: ["self-hosted", "k8s-prod"]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Define tag
        id: define-env
        run: |
          if [[ "${{ github.ref_name }}" == 'main'  ]]; then
            tag='latest'
          else
            tag='${{ github.sha }}'
          fi
          echo "tag=${tag}"
          echo "tag=${tag}" >> $GITHUB_OUTPUT
      - name: Build image
        run: |
          docker build -t $IMAGE_NAME:${{ steps.define-env.outputs.tag }} .
      - name: Push image
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          echo "Push image $IMAGE_NAME:${{ steps.define-env.outputs.tag }} to Docker registry"
          docker push --all-tags $IMAGE_NAME
